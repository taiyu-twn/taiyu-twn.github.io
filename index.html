<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泰宇減重追蹤系統</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --card2: #21253a;
    --accent: #4ade80;
    --accent2: #22d3ee;
    --warn: #fb923c;
    --danger: #f87171;
    --text: #f1f5f9;
    --muted: #64748b;
    --border: #2d3148;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
    max-width: 480px;
    margin: 0 auto;
  }

  h1 {
    font-size: 20px;
    font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }

  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
  }

  .card-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 12px;
  }

  .weight-display {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }

  .weight-box {
    flex: 1;
    background: var(--card2);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }

  .weight-box .label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .weight-box .value { font-size: 22px; font-weight: 700; }
  .weight-box .value.green { color: var(--accent); }
  .weight-box .value.cyan { color: var(--accent2); }
  .weight-box .value.warn { color: var(--warn); }

  .progress-bar-wrap {
    background: var(--card2);
    border-radius: 99px;
    height: 8px;
    overflow: hidden;
    margin-bottom: 6px;
  }

  .progress-bar {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.5s ease;
  }

  .progress-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
  }

  .checklist { display: flex; flex-direction: column; gap: 8px; }

  .check-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card2);
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.2s;
  }

  .check-item.done { border-color: var(--accent); opacity: 0.6; }

  .check-icon {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 12px;
    transition: all 0.2s;
  }

  .check-item.done .check-icon {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
  }

  .check-text { font-size: 14px; flex: 1; }
  .check-item.done .check-text { text-decoration: line-through; color: var(--muted); }

  .check-tag {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 99px;
    font-weight: 600;
  }
  .tag-food { background: #14532d; color: var(--accent); }
  .tag-move { background: #164e63; color: var(--accent2); }
  .tag-sup  { background: #431407; color: var(--warn); }

  .log-section { display: flex; flex-direction: column; gap: 8px; }

  .log-tabs { display: flex; gap: 6px; margin-bottom: 4px; }

  .tab-btn {
    flex: 1;
    padding: 7px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card2);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .tab-btn.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }

  textarea {
    width: 100%;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 12px;
    resize: none;
    min-height: 80px;
    outline: none;
    transition: border-color 0.2s;
  }

  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  .send-btn {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #000;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .ai-bubble {
    background: var(--card2);
    border-left: 3px solid var(--accent);
    border-radius: 0 12px 12px 0;
    padding: 14px;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    display: none;
  }

  .ai-bubble.show { display: block; }

  .typing { display: inline-flex; gap: 4px; align-items: center; }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: bounce 1s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  .history-list {
    display: flex; flex-direction: column; gap: 8px;
    max-height: 300px; overflow-y: auto;
  }

  .history-item {
    background: var(--card2);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
  }

  .history-meta {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .history-date { font-size: 11px; color: var(--muted); }
  .history-content { color: var(--text); line-height: 1.5; }
  .history-ai { color: var(--accent); font-size: 12px; margin-top: 6px; }

  .weight-input-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
  }

  input[type="number"] {
    flex: 1;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 16px;
    padding: 10px 14px;
    outline: none;
  }

  input[type="number"]:focus { border-color: var(--accent); }

  .update-btn {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #000;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }

  .timeline { display: flex; flex-direction: column; gap: 6px; }

  .timeline-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: var(--card2);
    border-radius: 8px;
    font-size: 13px;
  }

  .timeline-date { color: var(--muted); }
  .timeline-kg { font-weight: 600; }
  .diff-down { color: var(--accent); }
  .diff-up { color: var(--danger); }

  .empty-msg {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 20px;
  }

  .config-banner {
    background: #1c1410;
    border: 1px solid var(--warn);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--warn);
    margin-bottom: 12px;
    display: none;
  }
  .config-banner.show { display: block; }
  .config-banner input {
    width: 100%;
    margin-top: 8px;
    background: var(--card2);
    border: 1px solid var(--warn);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    padding: 8px 10px;
    outline: none;
  }
  .config-banner button {
    margin-top: 6px;
    padding: 7px 14px;
    border-radius: 8px;
    border: none;
    background: var(--warn);
    color: #000;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>💪 泰宇減重追蹤</h1>
<p class="subtitle">開始日期：2025/06/25 ・ 目標：72.9 → 62.0 kg</p>

<div class="config-banner" id="configBanner">
  ⚙️ 請先設定 Google Apps Script 網址才能使用雲端同步與 AI 功能
  <input type="text" id="gasUrlInput" placeholder="貼上你的 GAS Web App URL（https://script.google.com/macros/s/...）">
  <button onclick="saveGasUrl()">儲存</button>
</div>

<!-- 進度 -->
<div class="card">
  <div class="card-title">📊 減重進度</div>
  <div class="weight-display">
    <div class="weight-box">
      <div class="label">目前體重</div>
      <div class="value green" id="currentWeight">72.9</div>
      <div class="label">kg</div>
    </div>
    <div class="weight-box">
      <div class="label">已減少</div>
      <div class="value cyan" id="lostWeight">0.0</div>
      <div class="label">kg</div>
    </div>
    <div class="weight-box">
      <div class="label">距目標</div>
      <div class="value warn" id="remaining">10.9</div>
      <div class="label">kg</div>
    </div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>
  <div class="progress-labels">
    <span>72.9kg</span>
    <span id="progressPct">0%</span>
    <span>62.0kg</span>
  </div>
</div>

<!-- 體重更新 -->
<div class="card">
  <div class="card-title">⚖️ 更新體重</div>
  <div class="weight-input-row">
    <input type="number" id="newWeight" placeholder="輸入今日體重 kg" step="0.1" min="40" max="150">
    <button class="update-btn" onclick="updateWeight()">更新</button>
  </div>
  <div class="timeline" id="weightTimeline">
    <div class="empty-msg">尚無記錄</div>
  </div>
</div>

<!-- 每日清單 -->
<div class="card">
  <div class="card-title">✅ 今日執行清單</div>
  <div class="checklist" id="checklist"></div>
</div>

<!-- AI 教練 -->
<div class="card">
  <div class="card-title">🤖 AI 教練分析</div>
  <div class="log-section">
    <div class="log-tabs">
      <button class="tab-btn active" onclick="setTab('food')" id="tab-food">🍱 飲食</button>
      <button class="tab-btn" onclick="setTab('move')" id="tab-move">🏃 運動</button>
      <button class="tab-btn" onclick="setTab('free')" id="tab-free">💬 提問</button>
    </div>
    <textarea id="logInput" placeholder="例如：早餐吃了混合飲、雞蛋、蘋果，午餐排骨便當..."></textarea>
    <button class="send-btn" id="sendBtn" onclick="analyzeLog()">分析並給建議 →</button>
    <div class="ai-bubble" id="aiBubble"></div>
  </div>
</div>

<!-- 歷史記錄 -->
<div class="card">
  <div class="card-title">📝 記錄歷史</div>
  <div class="history-list" id="historyList">
    <div class="empty-msg">尚無記錄</div>
  </div>
</div>

<script>
const CONFIG = {
  GAS_URL: localStorage.getItem('gasUrl') || '',
  startWeight: 72.9,
  targetWeight: 62.0,
  startDate: '2025-06-25',
};

function checkGasUrl() {
  if (!CONFIG.GAS_URL) {
    document.getElementById('configBanner').classList.add('show');
  }
}

function saveGasUrl() {
  const url = document.getElementById('gasUrlInput').value.trim();
  if (!url.startsWith('https://script.google.com')) {
    alert('請輸入正確的 GAS URL');
    return;
  }
  CONFIG.GAS_URL = url;
  localStorage.setItem('gasUrl', url);
  document.getElementById('configBanner').classList.remove('show');
  loadFromGAS();
}

async function gasGet(action, params = {}) {
  if (!CONFIG.GAS_URL) return null;
  const url = new URL(CONFIG.GAS_URL);
  url.searchParams.set('action', action);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  try {
    const res = await fetch(url.toString());
    return await res.json();
  } catch (e) {
    console.error('GAS GET error:', e);
    return null;
  }
}

async function gasPost(action, body = {}) {
  if (!CONFIG.GAS_URL) return null;
  const url = new URL(CONFIG.GAS_URL);
  url.searchParams.set('action', action);
  try {
    const res = await fetch(url.toString(), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    return await res.json();
  } catch (e) {
    console.error('GAS POST error:', e);
    return null;
  }
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

let weightHistory = JSON.parse(localStorage.getItem('weightHistory') || '[]');
let logHistory    = JSON.parse(localStorage.getItem('logHistory') || '[]');
let todayChecks   = JSON.parse(localStorage.getItem('checks_' + todayStr()) || '{}');
let currentTab    = 'food';

const CHECKLIST = [
  { id: 'sup1',  text: '起床：強健活力組合（全套）',              tag: 'sup',  label: '補充品' },
  { id: 'food1', text: '早餐：混合飲 + 雞蛋 + 蘋果',            tag: 'food', label: '飲食' },
  { id: 'move1', text: '早上：走路30分鐘',                        tag: 'move', label: '運動' },
  { id: 'sup2',  text: '早餐後：好甘萃1錠',                      tag: 'sup',  label: '補充品' },
  { id: 'food2', text: '午餐：低油高蛋白外食',                    tag: 'food', label: '飲食' },
  { id: 'sup3',  text: '午餐後：好甘萃1錠',                      tag: 'sup',  label: '補充品' },
  { id: 'move2', text: '中午：爬樓梯18層',                        tag: 'move', label: '運動' },
  { id: 'food3', text: '下午：混合飲40g',                         tag: 'food', label: '飲食' },
  { id: 'food4', text: '晚餐：混合飲 + 茶葉蛋（7-8點）',         tag: 'food', label: '飲食' },
  { id: 'sup4',  text: '晚餐後：強健活力組合（無倍欣）+ 好甘萃', tag: 'sup',  label: '補充品' },
  { id: 'move3', text: '晚上9-10點：滑步機1小時',                 tag: 'move', label: '運動' },
  { id: 'food5', text: '運動後：蛋白素2匙 + 水',                 tag: 'food', label: '飲食' },
  { id: 'sup5',  text: '睡前：加美D鈣片2顆',                     tag: 'sup',  label: '補充品' },
];

function renderChecklist() {
  document.getElementById('checklist').innerHTML = CHECKLIST.map(item => {
    const done = !!todayChecks[item.id];
    return `<div class="check-item ${done ? 'done' : ''}" onclick="toggleCheck('${item.id}')">
      <div class="check-icon">${done ? '✓' : ''}</div>
      <div class="check-text">${item.text}</div>
      <span class="check-tag tag-${item.tag}">${item.label}</span>
    </div>`;
  }).join('');
}

async function toggleCheck(id) {
  todayChecks[id] = !todayChecks[id];
  localStorage.setItem('checks_' + todayStr(), JSON.stringify(todayChecks));
  renderChecklist();
  await gasPost('toggleCheck', { date: todayStr(), id, done: todayChecks[id] });
}

async function updateWeight() {
  const val = parseFloat(document.getElementById('newWeight').value);
  if (!val || val < 40 || val > 150) { alert('請輸入正確體重'); return; }

  const entry = { date: todayStr(), weight: val };
  weightHistory = weightHistory.filter(e => e.date !== todayStr());
  weightHistory.push(entry);
  weightHistory.sort((a, b) => a.date.localeCompare(b.date));
  localStorage.setItem('weightHistory', JSON.stringify(weightHistory));

  document.getElementById('newWeight').value = '';
  renderProgress();
  renderTimeline();

  await gasPost('addWeight', entry);
}

function renderProgress() {
  const latest = weightHistory.length
    ? weightHistory[weightHistory.length - 1].weight
    : CONFIG.startWeight;
  const lost  = Math.max(0, CONFIG.startWeight - latest);
  const total = CONFIG.startWeight - CONFIG.targetWeight;
  const pct   = Math.min(100, lost / total * 100).toFixed(1);
  const rem   = Math.max(0, latest - CONFIG.targetWeight);

  document.getElementById('currentWeight').textContent = latest.toFixed(1);
  document.getElementById('lostWeight').textContent    = lost.toFixed(1);
  document.getElementById('remaining').textContent     = rem.toFixed(1);
  document.getElementById('progressBar').style.width   = pct + '%';
  document.getElementById('progressPct').textContent   = pct + '%';
}

function renderTimeline() {
  const el = document.getElementById('weightTimeline');
  if (!weightHistory.length) {
    el.innerHTML = '<div class="empty-msg">尚無記錄</div>';
    return;
  }
  el.innerHTML = [...weightHistory].reverse().slice(0, 6).map((e, i, arr) => {
    const prev = arr[i + 1];
    const diff = prev ? (e.weight - prev.weight).toFixed(1) : null;
    const diffHtml = diff !== null
      ? `<span class="${parseFloat(diff) < 0 ? 'diff-down' : 'diff-up'}">${parseFloat(diff) > 0 ? '+' : ''}${diff} kg</span>`
      : '<span style="color:var(--muted)">起點</span>';
    return `<div class="timeline-item">
      <span class="timeline-date">${e.date}</span>
      <span class="timeline-kg">${e.weight} kg</span>
      ${diffHtml}
    </div>`;
  }).join('');
}

function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  const ph = {
    food: '例如：早餐混合飲+蛋+蘋果，午餐排骨便當，晚上喝了珍奶...',
    move: '例如：早上走路完成，中午忘了爬樓梯，滑步機只做30分鐘...',
    free: '例如：體重停滯3天怎麼辦？或本週想多吃一餐正常晚餐可以嗎？',
  };
  document.getElementById('logInput').placeholder = ph[tab];
}

async function analyzeLog() {
  const input = document.getElementById('logInput').value.trim();
  if (!input) return;
  if (!CONFIG.GAS_URL) {
    document.getElementById('configBanner').classList.add('show');
    return;
  }

  const btn    = document.getElementById('sendBtn');
  const bubble = document.getElementById('aiBubble');
  btn.disabled = true;
  bubble.classList.add('show');
  bubble.innerHTML = '<div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';

  const latest  = weightHistory.length ? weightHistory[weightHistory.length - 1].weight : CONFIG.startWeight;
  const lost    = (CONFIG.startWeight - latest).toFixed(1);
  const tabLabels = { food: '飲食記錄', move: '運動記錄', free: '自由提問' };

  const unchecked = CHECKLIST.filter(i => !todayChecks[i.id]).map(i => i.text);

  const result = await gasPost('analyze', {
    type:      currentTab,
    input,
    weight:    latest,
    lost,
    remaining: (latest - CONFIG.targetWeight).toFixed(1),
    unchecked,
  });

  const text = result?.reply || '無法取得回應，請確認 GAS 設定正確。';
  bubble.textContent = text;

  const entry = {
    date:    new Date().toLocaleString('zh-TW'),
    type:    tabLabels[currentTab],
    tag:     currentTab,
    content: input,
    ai:      text,
  };
  logHistory.unshift(entry);
  if (logHistory.length > 20) logHistory.pop();
  localStorage.setItem('logHistory', JSON.stringify(logHistory));
  renderHistory();

  document.getElementById('logInput').value = '';
  btn.disabled = false;
}

function renderHistory() {
  const el = document.getElementById('historyList');
  if (!logHistory.length) {
    el.innerHTML = '<div class="empty-msg">尚無記錄</div>';
    return;
  }
  const tagColor = { food: 'tag-food', move: 'tag-move', free: 'tag-sup' };
  el.innerHTML = logHistory.map(e => `
    <div class="history-item">
      <div class="history-meta">
        <span class="check-tag ${tagColor[e.tag] || 'tag-sup'}">${e.type}</span>
        <span class="history-date">${e.date}</span>
      </div>
      <div class="history-content">${e.content}</div>
      <div class="history-ai">🤖 ${e.ai.slice(0, 80)}${e.ai.length > 80 ? '...' : ''}</div>
    </div>
  `).join('');
}

async function loadFromGAS() {
  const wData = await gasGet('getWeight');
  if (wData?.records?.length) {
    weightHistory = wData.records;
    localStorage.setItem('weightHistory', JSON.stringify(weightHistory));
    renderProgress();
    renderTimeline();
  }

  const cData = await gasGet('getChecks', { date: todayStr() });
  if (cData?.checks) {
    todayChecks = cData.checks;
    localStorage.setItem('checks_' + todayStr(), JSON.stringify(todayChecks));
    renderChecklist();
  }

  const lData = await gasGet('getLogs');
  if (lData?.logs?.length) {
    logHistory = lData.logs;
    localStorage.setItem('logHistory', JSON.stringify(logHistory));
    renderHistory();
  }
}

checkGasUrl();
renderChecklist();
renderProgress();
renderTimeline();
renderHistory();
if (CONFIG.GAS_URL) loadFromGAS();
</script>
</body>
</html>
