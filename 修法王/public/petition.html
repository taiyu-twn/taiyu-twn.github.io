<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>連署 — 修法王</title>
<script src="/修法王/public/js/app.js"></script>
</head>
<body>
<div class="container" style="max-width:700px">
  <div class="card" style="text-align:center;padding:2.5rem">
    <h1 style="margin-bottom:1rem">📜 連署推動修法</h1>
    <h2 style="color:var(--green);margin-bottom:1.5rem">兒少性侵追訴期修法</h2>
    <div style="text-align:left;max-width:550px;margin:0 auto 2rem;line-height:1.8;color:#444">
      <p>目前台灣《刑事訴訟法》針對性侵案件的追訴期規定，使許多受害者在成年後才有能力開口，卻已無法追訴加害者。</p>
      <br>
      <p>我們主張：<strong>兒少性侵案件的追訴期應從受害者成年之日起計算</strong>，給予受害者充足的時間尋求司法救濟。</p>
      <br>
      <p>您的每一份連署，都是讓這個聲音被聽見的力量。</p>
    </div>
    <div style="margin-bottom:1.5rem">
      <p style="font-size:1.1rem" id="sigCount">載入中...</p>
      <div class="progress-bar" style="max-width:400px;margin:.5rem auto">
        <div class="progress-fill" id="sigBar" style="width:0%"></div>
      </div>
      <p style="color:#666" id="sigPct"></p>
    </div>
    <div id="actionArea"><span class="spinner"></span></div>
  </div>
</div>

<script>
injectLayout('連署');

async function loadPetition() {
  const r = await api('getPetitionCount');
  if (r.status === 'success') {
    const pct = Math.min(100, (r.total / r.target * 100).toFixed(1));
    document.getElementById('sigCount').innerHTML =
      `目前已有 <strong style="color:var(--green);font-size:1.5rem">${numFmt(r.total)}</strong> 人連署`;
    document.getElementById('sigBar').style.width = pct + '%';
    document.getElementById('sigPct').textContent = `目標 ${numFmt(r.target)} 人（${pct}% 達成）`;
  }

  const area = document.getElementById('actionArea');
  if (!isLoggedIn()) {
    area.innerHTML = `<a href="/修法王/public/login.html?redirect=${encodeURIComponent(location.href)}" class="btn btn-green" style="font-size:1.1rem;padding:1rem 2rem">登入後連署</a>`;
    return;
  }
  if (hasSigned()) {
    area.innerHTML = '<div class="alert-success" style="max-width:400px;margin:0 auto">✅ 您已完成連署，感謝您的支持！</div>';
    return;
  }

  area.innerHTML = `
    <button id="signBtn" class="btn btn-green" style="font-size:1.1rem;padding:1rem 2.5rem">我同意連署</button>
    <div id="signMsg" style="margin-top:1rem;font-weight:600"></div>`;

  document.getElementById('signBtn').onclick = async () => {
    const btn = document.getElementById('signBtn');
    btn.disabled = true;
    btn.textContent = '處理中...';
    const res = await api('sign');
    if (res.status === 'success' || res.status === 'already_signed') {
      markSigned();
      document.getElementById('signMsg').style.color = 'var(--green)';
      document.getElementById('signMsg').textContent = `✅ 連署成功！目前 ${numFmt(res.total)} 人連署`;
      btn.style.display = 'none';
    } else {
      document.getElementById('signMsg').style.color = 'var(--red)';
      document.getElementById('signMsg').textContent = '❌ ' + (res.msg || '連署失敗');
      btn.disabled = false;
      btn.textContent = '我同意連署';
    }
  };
}

loadPetition();
</script>
</body>
</html>
